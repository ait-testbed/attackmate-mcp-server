[project]
name = "attackmate-mcp-server"
version = "0.1.0"
description = "MCP server for LLM interaction with AttackMate"
readme = "README.md"
license = {text = "EUPL-1.2"}
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.28.1",
    "httpx>=0.28",
    "pydantic-settings>=2.0",
    "attackmate @ git+https://github.com/ait-testbed/attackmate.git@development",
]

[project.scripts]
attackmate-mcp = "attackmate_mcp_server.server:run"

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",
    "ruff==0.15.21",
    "types-paramiko>=5.0.0.20260617",
    "types-pyyaml>=6.0.12.20260518",
    "types-requests>=2.33.0.20260712",
    "types-tabulate>=0.10.0.20260508",
]

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["attackmate"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "attackmate.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
namespaces = true
where = ["src"]
